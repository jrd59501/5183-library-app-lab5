name: Build and deploy Node.js app with React (Vite) frontend to Azure Web App - app-lab06-jrd

on:
  push:
    branches:
      - lab6-ready-jrd
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Install API dependencies
      - name: Install backend dependencies
        run: npm ci

      # Build the React frontend
      - name: Build React app (Vite)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # Optional: confirm the dist folder exists
      - name: List Vite build output
        run: ls -la web/dist

      # Upload everything for deploy step
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App (staging)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-lab06-jrd'
          slot-name: 'staging'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_STAGING }}
